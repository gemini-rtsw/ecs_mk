name: Build

on:
  push:
    branches: [REL-4863_final]
  pull_request:
    branches: [main]

# NOTE (REL-4863_final): el9 only. The el8 matrix leg currently fails in
# `dnf builddep` because the shared rpm-repo:latest serves both el8 and el9
# packages and dnf picks the .el9 epics-base-devel/rtems into an el8 container
# (glibc too old). That's a CI-infra issue in gemini-rtsw-ci, not this change.
# The schematic (tdct) build that exercises dev3Ctrl is EL-independent, so el9
# fully verifies the autoclose fix. Restore ['8','9'] once the el8 leg is
# pointed at the el8-only rpm-repo image.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        el: ['9']
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/ci.yml@main
    with:
      scripts_dir: gemini-rtsw-ci
      el_version: ${{ matrix.el }}
